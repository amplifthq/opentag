name: opentag

x-control-plane-environment: &control-plane-environment
  DATABASE_URL: postgresql://opentag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/opentag
  OPENTAG_BOOTSTRAP_ORGANIZATION_ID: ${OPENTAG_BOOTSTRAP_ORGANIZATION_ID:-org_local}
  OPENTAG_BOOTSTRAP_ORGANIZATION_NAME: ${OPENTAG_BOOTSTRAP_ORGANIZATION_NAME:-Local OpenTag}
  OPENTAG_BOOTSTRAP_PAIRING_TOKEN: ${OPENTAG_BOOTSTRAP_PAIRING_TOKEN:?set OPENTAG_BOOTSTRAP_PAIRING_TOKEN}
  OPENTAG_FENCING_TOKEN_SECRET: ${OPENTAG_FENCING_TOKEN_SECRET:?set OPENTAG_FENCING_TOKEN_SECRET}
  OPENTAG_LOGIN_THROTTLE_SECRET: ${OPENTAG_LOGIN_THROTTLE_SECRET:?set OPENTAG_LOGIN_THROTTLE_SECRET}
  OPENTAG_LOGIN_NETWORK_THROTTLE_MODE: ${OPENTAG_LOGIN_NETWORK_THROTTLE_MODE:-direct-peer}
  OPENTAG_RECOVERY_PAIRING_TOKEN: ${OPENTAG_RECOVERY_PAIRING_TOKEN:-}
  OPENTAG_PUBLIC_URL: ${OPENTAG_PUBLIC_URL:-http://127.0.0.1:3000}
  OPENTAG_ENVIRONMENT: ${OPENTAG_ENVIRONMENT:-local}
  OPENTAG_RELEASE_SHA: ${OPENTAG_RELEASE_SHA:-local}
  OPENTAG_GITHUB_INGRESS_MASTER_SECRET: ${OPENTAG_GITHUB_INGRESS_MASTER_SECRET:-}
  OPENTAG_DB_POOL_MAX: ${OPENTAG_DB_POOL_MAX:-10}
  OPENTAG_JOB_LEASE_MS: ${OPENTAG_JOB_LEASE_MS:-30000}
  OPENTAG_JOB_POLL_MS: ${OPENTAG_JOB_POLL_MS:-1000}
  OPENTAG_JOB_RETRY_MS: ${OPENTAG_JOB_RETRY_MS:-30000}
  OPENTAG_LOGIN_MAX_FAILURES: ${OPENTAG_LOGIN_MAX_FAILURES:-5}
  OPENTAG_LOGIN_NETWORK_MAX_FAILURES: ${OPENTAG_LOGIN_NETWORK_MAX_FAILURES:-50}
  OPENTAG_LOGIN_WINDOW_MS: ${OPENTAG_LOGIN_WINDOW_MS:-300000}
  OPENTAG_LOGIN_LOCKOUT_MS: ${OPENTAG_LOGIN_LOCKOUT_MS:-900000}
  OPENTAG_RELAY_CONTENT_KEK_FILE: /run/secrets/opentag_relay_content_kek
  OPENTAG_RELAY_CONTENT_KEY_VERSION: v1

x-slack-bootstrap-secrets: &slack-bootstrap-secrets
  - opentag_slack_signing_secret
  - opentag_slack_bot_token

x-control-plane-runtime-secrets: &control-plane-runtime-secrets
  - opentag_relay_content_kek
  - opentag_slack_signing_secret
  - opentag_slack_bot_token

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opentag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: opentag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentag -d opentag"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - opentag-postgres:/var/lib/postgresql/data

  migrate:
    image: opentag-control-plane:local
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    command: ["node", "apps/control-plane/dist/index.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *control-plane-environment
    restart: "no"

  bootstrap-admin:
    image: opentag-control-plane:local
    command: ["node", "apps/control-plane/dist/index.js", "bootstrap-admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *control-plane-environment
      OPENTAG_BOOTSTRAP_ADMIN_EMAIL: ${OPENTAG_BOOTSTRAP_ADMIN_EMAIL:?set OPENTAG_BOOTSTRAP_ADMIN_EMAIL}
      OPENTAG_BOOTSTRAP_ADMIN_NAME: ${OPENTAG_BOOTSTRAP_ADMIN_NAME:-OpenTag Owner}
      OPENTAG_BOOTSTRAP_ADMIN_PASSWORD: ${OPENTAG_BOOTSTRAP_ADMIN_PASSWORD:?set OPENTAG_BOOTSTRAP_ADMIN_PASSWORD}
    restart: "no"

  bootstrap-slack:
    image: opentag-control-plane:local
    command: ["node", "apps/control-plane/dist/index.js", "bootstrap-slack"]
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    environment:
      <<: *control-plane-environment
      OPENTAG_SLACK_INSTALLATION_ID: ${OPENTAG_SLACK_INSTALLATION_ID:?set OPENTAG_SLACK_INSTALLATION_ID}
      OPENTAG_SLACK_BINDING_ID: ${OPENTAG_SLACK_BINDING_ID:?set OPENTAG_SLACK_BINDING_ID}
      OPENTAG_SLACK_ROUTE_IDENTITY: ${OPENTAG_SLACK_ROUTE_IDENTITY:?set OPENTAG_SLACK_ROUTE_IDENTITY}
      OPENTAG_SLACK_PROJECT_TARGET_ID: ${OPENTAG_SLACK_PROJECT_TARGET_ID:?set OPENTAG_SLACK_PROJECT_TARGET_ID}
      OPENTAG_SLACK_PUBLICATION_MODE: ${OPENTAG_SLACK_PUBLICATION_MODE:-proposal_only}
      OPENTAG_SLACK_TEAM_ID: ${OPENTAG_SLACK_TEAM_ID:?set OPENTAG_SLACK_TEAM_ID}
      OPENTAG_SLACK_APP_ID: ${OPENTAG_SLACK_APP_ID:?set OPENTAG_SLACK_APP_ID}
      OPENTAG_SLACK_CHANNEL_ID: ${OPENTAG_SLACK_CHANNEL_ID:?set OPENTAG_SLACK_CHANNEL_ID}
      OPENTAG_SLACK_BOT_USER_ID: ${OPENTAG_SLACK_BOT_USER_ID:?set OPENTAG_SLACK_BOT_USER_ID}
      OPENTAG_SLACK_MEMBER_USER_IDS: ${OPENTAG_SLACK_MEMBER_USER_IDS:?set OPENTAG_SLACK_MEMBER_USER_IDS}
      OPENTAG_SLACK_OPERATOR_USER_IDS: ${OPENTAG_SLACK_OPERATOR_USER_IDS:-}
      OPENTAG_SLACK_APPROVER_USER_ID: ${OPENTAG_SLACK_APPROVER_USER_ID:-}
      OPENTAG_SLACK_ADMIN_USER_IDS: ${OPENTAG_SLACK_ADMIN_USER_IDS:-}
      OPENTAG_SLACK_SIGNING_SECRET_REF: file:/run/secrets/opentag_slack_signing_secret
      OPENTAG_SLACK_BOT_TOKEN_REF: file:/run/secrets/opentag_slack_bot_token
    secrets: *slack-bootstrap-secrets
    restart: "no"

  control-plane:
    image: opentag-control-plane:local
    command: ["node", "apps/control-plane/dist/index.js", "serve"]
    depends_on:
      bootstrap-slack:
        condition: service_completed_successfully
    environment: *control-plane-environment
    labels:
      io.opentag.profile-envelope: Runner-offline-safe
      io.opentag.availability: Relay-not-HA
    secrets: *control-plane-runtime-secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${OPENTAG_BIND_ADDRESS:-127.0.0.1}:${OPENTAG_PORT:-3000}:3000"
    restart: unless-stopped

  jobs:
    image: opentag-control-plane:local
    command: ["node", "apps/control-plane/dist/index.js", "jobs"]
    depends_on:
      control-plane:
        condition: service_healthy
    environment: *control-plane-environment
    secrets: *control-plane-runtime-secrets
    restart: unless-stopped

secrets:
  opentag_relay_content_kek:
    file: ${OPENTAG_RELAY_CONTENT_KEK_SOURCE_FILE:?set OPENTAG_RELAY_CONTENT_KEK_SOURCE_FILE to the KEK file path}
  opentag_slack_signing_secret:
    file: ${OPENTAG_SLACK_SIGNING_SECRET_SOURCE_FILE:?set OPENTAG_SLACK_SIGNING_SECRET_SOURCE_FILE}
  opentag_slack_bot_token:
    file: ${OPENTAG_SLACK_BOT_TOKEN_SOURCE_FILE:?set OPENTAG_SLACK_BOT_TOKEN_SOURCE_FILE}

volumes:
  opentag-postgres:
