name: Bug report
description: Report a reproducible problem in OpenTag.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenTag. Remove secrets, tokens, private repository data, and personal information from every field and attachment.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: OpenTag version or commit
      description: Use `opentag --version` or a commit SHA when possible.
      placeholder: 0.x.x or abc1234
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Slack Source App
        - GitHub Project Target or publication
        - Local Runner or executor
        - Control Plane or relay
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, package manager, provider, and relevant non-secret configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add relevant logs, receipts, screenshots, or stack traces after removing secrets and private data.
    validations:
      required: false
